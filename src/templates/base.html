<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · School Schedule</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">📚 School Schedule</a>
    <div class="topbar-user">
      <span class="badge badge-{{ user.role.value }}">
        {{ {'admin': 'Адміністратор', 'teacher': 'Вчитель', 'student': 'Учень', 'parent': 'Батьки'}[user.role.value] }}
      </span>
      <span>{{ user.full_name }}</span>
      <a href="/logout" class="btn btn-ghost">Вийти</a>
    </div>
  </header>
  {% endif %}
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
