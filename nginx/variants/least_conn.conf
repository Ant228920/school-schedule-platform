# Додаткове 1: Least Connections. Новий запит іде на репліку з найменшою кількістю активних з'єднань.
upstream school_backend {
    zone school_backend 64k;
    least_conn;
    server web1:8000 max_fails=2 fail_timeout=10s;
    server web2:8000 max_fails=2 fail_timeout=10s;
    server web3:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://school_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
    }
}
