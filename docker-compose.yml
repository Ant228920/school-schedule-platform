# Спільні налаштування для всіх реплік застосунку
x-web: &web
  build:
    context: .
    target: runtime
  image: school-schedule-web
  env_file: .env
  environment:
    # у контейнері БД і Redis доступні за іменем сервісу, а не localhost
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  networks:
    - backend
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=3)"
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у файлі .env}
      POSTGRES_DB: ${POSTGRES_DB:-school-schedule}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Спільний кеш для всіх реплік: інвалідація на одній репліці діє на решту.
  # Лише пам'ять, без запису на диск; при заповненні витісняє найстарші ключі (LRU).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Перша репліка створює таблиці при старті, тому решта чекає на неї
  web1:
    <<: *web
    hostname: web1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # порт відкрито лише для порівняльного тесту «одна репліка» (додаткове 2)
    ports:
      - "8000:8000"

  web2:
    <<: *web
    hostname: web2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web1:
        condition: service_healthy

  web3:
    <<: *web
    hostname: web3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web1:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      web3:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
